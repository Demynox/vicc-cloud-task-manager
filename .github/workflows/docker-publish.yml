# Automatisierter Build-, Test- und Publish-Prozess
# für das Docker-Image des Cloud Task Managers.
name: Build, test and publish Docker image


# Der Workflow startet bei Änderungen am Anwendungscode
# oder kann manuell in GitHub gestartet werden.
on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/docker-publish.yml"

  workflow_dispatch:


# Der Workflow benötigt nur Leserechte auf das Repository.
permissions:
  contents: read


env:
  IMAGE_NAME: vicc-cloud-task-manager


jobs:
  build-test-push:
    name: Build, smoke test and push
    runs-on: ubuntu-latest

    steps:

      # Aktuellen Source Code aus dem Repository laden.
      - name: Checkout repository
        uses: actions/checkout@v4


      # Docker-Image aus dem Dockerfile der Anwendung erstellen.
      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}:test" ./app


      # Container lokal im GitHub Runner starten.
      # Für den Smoke Test wird bewusst das lokale Storage-Backend verwendet.
      - name: Start container for smoke test
        run: |
          docker run -d \
            --name taskmanager \
            -p 8000:8000 \
            -e STORAGE_BACKEND=local \
            "${IMAGE_NAME}:test"


      # Warten, bis Flask/Gunicorn vollständig gestartet ist
      # und der Health-Endpunkt erfolgreich antwortet.
      - name: Wait for API
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi

            sleep 2
          done

          echo "API did not become ready"
          docker logs taskmanager
          exit 1


      # Grundlegender API-Smoke-Test:
      # Health Check, Task erstellen und Task wieder auslesen.
      - name: Test API
        run: |
          curl --fail --silent http://127.0.0.1:8000/api/health
          echo

          curl --fail --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"title":"GitHub Actions Test"}' \
            http://127.0.0.1:8000/api/tasks

          echo

          curl --fail --silent http://127.0.0.1:8000/api/tasks | grep -q "GitHub Actions Test"
          echo "API smoke test successful"


      # Der Testcontainer wird auch dann entfernt,
      # wenn ein vorheriger Testschritt fehlgeschlagen ist.
      - name: Stop test container
        if: always()
        run: docker rm -f taskmanager || true


      # Anmeldung an Docker Hub mit GitHub Secrets.
      # Benutzername und Token stehen nicht im Source Code.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # Das geprüfte Image erhält einen latest-Tag
      # sowie eine versionierte Kennzeichnung.
      - name: Tag Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

        run: |
          docker tag "${IMAGE_NAME}:test" "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
          docker tag "${IMAGE_NAME}:test" "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:1.0.${GITHUB_RUN_NUMBER}"


      # Beide Tags werden in das öffentliche Docker-Hub-Repository geladen.
      - name: Push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

        run: |
          docker push "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:latest"
          docker push "${DOCKERHUB_USERNAME}/${IMAGE_NAME}:1.0.${GITHUB_RUN_NUMBER}"
